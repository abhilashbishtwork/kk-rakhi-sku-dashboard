name: Rakhi SKU data refresh (every 30 min)

on:
  schedule:
    - cron: "5,35 * * * *"   # every 30 min, at :05 and :35 (offset from the hour to dodge GH Actions' top-of-hour congestion)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: hourly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build dashboard data
        env:
          CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}
        run: python3 -m build.build_data

      - name: Commit and push data.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json data-*.json index.html
          if git diff --staged --quiet; then
            echo "No data changes, skipping commit."
            exit 0
          fi
          git commit -m "Hourly data refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
